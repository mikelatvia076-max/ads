<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Student Registration</h1>
        <form id="regForm" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
                <small class="error"></small>
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required>
                <small class="error"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" pattern="\\d{10}" required>
                <small class="error"></small>
           </div>

           <div class="form-group">
                <label for="pwd">Password</label>
               <input type="password" id="pwd" name="pwd" minlength="6" required>
                <small class="error"></small>
            </div>

           <div class="form-group">
                <label for="pwd2">Confirm Password</label>
                <input type="password" id="pwd2" name="pwd2" minlength="6" required>
                <small class="error"></small>
           </div>

            <button type="submit">Register</button>
       </form>
        <p id="successMsg" class="success"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
